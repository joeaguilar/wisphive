name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/wisphive_web/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/wisphive_web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  security:
    name: Dependency and SQL safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install dependency audit tools
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-audit --locked

      - name: cargo-deny
        run: cargo deny check advisories bans sources

      - name: cargo-audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2017-0008 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0134

      - name: DENY-LIST dynamically formatted SQL
        shell: bash
        run: |
          # The DML-shaped format! pattern intentionally requires an
          # interpolation. This avoids flagging logs or comments that merely
          # mention SQL keywords. No source files are currently allowlisted.
          # Keep any approved exceptions as --glob exclusions below, with a
          # justification and issue link.
          readonly -a sql_format_allowlist=(
          )
          if matches="$(rg --pcre2 --multiline --line-number --glob '*.rs' \
            '(?is)format!\s*\((?=[^)]*\b(?:select\s+.+\s+from|insert\s+(?:or\s+\w+\s+)?into|update\s+\w+\s+set|delete\s+from)\b)(?=[^)]*\{[^}]*\})[^)]*\)' \
            "${sql_format_allowlist[@]}" crates/wisphive_daemon)"; then
            rg_status=0
          else
            rg_status=$?
          fi

          case "$rg_status" in
          0)
            echo "DENY-LIST violation: use parameter binding or QueryBuilder, never format! for DML."
            echo "$matches"
            exit 1
            ;;
          1)
            # No matches: the deny-list gate passes.
            ;;
          2)
            echo "DENY-LIST check failed: ripgrep could not compile or run the pattern." >&2
            exit 2
            ;;
          *)
            echo "DENY-LIST check failed: ripgrep exited with status $rg_status." >&2
            exit "$rg_status"
            ;;
          esac
