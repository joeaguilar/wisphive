[package]
name = "wisphive_web"
description = "Web UI server for the Wisphive agent control plane"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
wisphive_protocol.workspace = true
wisphive_daemon.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
axum.workspace = true
tower-http.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
futures-util.workspace = true
base64.workspace = true
rand = "0.9"
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
axum-server.workspace = true
if-addrs.workspace = true
hostname.workspace = true
sha2.workspace = true
argon2.workspace = true
webauthn-rs.workspace = true
uuid.workspace = true
time.workspace = true
libc.workspace = true
subtle.workspace = true
thiserror.workspace = true
# itr#310: url is used by `auth_profile::rp_id_for_origin` to decompose
# the request `Origin` header into a `Host` variant (Domain / Ipv4 / Ipv6)
# before mapping to an RP ID. We pin to the same version `webauthn-rs`
# already pulls in transitively so the dep graph stays single-versioned.
url = "2"
# itr#310: sqlx is used by the profile-switch detection stub to probe
# `web_passkeys.rp_id` and tolerate the "no such column" error until
# itr#311 adds the column. We pin to the workspace's existing sqlx
# (already a dep of wisphive_daemon) to keep one version in the tree.
sqlx.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["test-util"] }
x509-parser = "0.16"
