[package]
name = "wisphive_web"
description = "Web UI server for the Wisphive agent control plane"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
wisphive_protocol.workspace = true
wisphive_daemon.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
axum.workspace = true
tower-http.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
futures-util.workspace = true
base64.workspace = true
rand = "0.9"
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
axum-server.workspace = true
if-addrs.workspace = true
hostname.workspace = true
sha2.workspace = true
argon2.workspace = true
webauthn-rs.workspace = true
uuid.workspace = true
time.workspace = true
# itr#311: RFC3339 timestamps in passkey-handler responses. `chrono` is
# already a workspace-default dep (used by `wisphive_protocol`) so adding
# the explicit declaration here doesn't bloat the dep graph.
chrono.workspace = true
libc.workspace = true
subtle.workspace = true
thiserror.workspace = true
# itr#310: url is used by `auth_profile::rp_id_for_origin` to decompose
# the request `Origin` header into a `Host` variant (Domain / Ipv4 / Ipv6)
# before mapping to an RP ID. We pin to the same version `webauthn-rs`
# already pulls in transitively so the dep graph stays single-versioned.
url = "2"
# itr#310: sqlx is used by the profile-switch detection stub to probe
# `web_passkeys.rp_id` and tolerate the "no such column" error until
# itr#311 adds the column. We pin to the workspace's existing sqlx
# (already a dep of wisphive_daemon) to keep one version in the tree.
sqlx.workspace = true
# itr#228: tls.rs uses this to pull the SubjectPublicKeyInfo out of an
# on-disk cert so `try_load_existing` can verify it actually matches the
# loaded private key before reusing the pair. Was previously a dev-only dep
# (test-only validity-window parsing); promoted to a real dependency now
# that production code needs it too.
x509-parser = "0.16"

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["test-util"] }
